<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Support · Dsoon</title>
<style>
  :root{ --navy:#0A1633; --cyan:#22D3EE; --muted:#64748b; --line:#e2e8f0; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:#f5f7fb;color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:420px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;box-shadow:0 8px 30px rgba(10,22,51,.08);text-align:center}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:4px}
  h1{font-size:20px;margin:0 0 18px;color:var(--navy)}
  .prod{background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;text-align:left}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
  .row .k{color:var(--muted)}
  .row .v{font-weight:600;word-break:break-word;text-align:right}
  .status{font-size:14px;color:var(--muted);margin-bottom:18px}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--cyan);
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-block;width:100%;padding:13px 0;border-radius:10px;border:none;cursor:pointer;
    background:var(--navy);color:#fff;font-size:15px;font-weight:600;text-decoration:none}
  .btn:hover{background:#12224a}
  .btn.hint{background:#fff;color:var(--navy);border:1px solid var(--line);margin-top:10px}
  .err{color:#dc2626;font-size:14px}
  .foot{margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Dsoon</div>
  <h1>Product Support</h1>
  <div id="content"><p class="status"><span class="spinner"></span>Loading…</p></div>
  <div class="foot">We're here to help with your Dsoon product.</div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var to=(q.get('to')||'').trim();
  var model=(q.get('m')||'').trim();
  var name=(q.get('n')||'').trim();
  var box=document.getElementById('content');

  if(!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to) || !model || !name){
    box.innerHTML='<p class="err">This support link is incomplete or invalid.<br>Please contact us via the email address on your order page.</p>';
    return;
  }

  var subject='Product Support Request – '+model+' – '+name;
  var body='Hello,\n\n'
    +'I\'m contacting you regarding the following product:\n\n'
    +'Product Model: '+model+'\n'
    +'Product Name: '+name+'\n'
    +'Amazon Order Number: [Please enter your order number]\n\n'
    +'Problem Description:\n'
    +'[Please describe the issue you are experiencing here. ]';
  var mailto='mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);

  box.innerHTML=
    '<div class="prod">'
    +  '<div class="row"><span class="k">Product Model</span><span class="v"></span></div>'
    +  '<div class="row"><span class="k">Product Name</span><span class="v"></span></div>'
    +'</div>'
    +'<p class="status" id="st"><span class="spinner"></span>Opening your email app…</p>'
    +'<a class="btn" id="go" href="#">Open Email App</a>'
    +'<p class="err" id="fail" style="display:none">If nothing opened, please email us directly at <b></b></p>';

  var vs=box.querySelectorAll('.v'); vs[0].textContent=model; vs[1].textContent=name;

  var go=document.getElementById('go');
  go.href=mailto;
  go.addEventListener('click', function(){
    document.getElementById('st').innerHTML='<span class="spinner"></span>Opening your email app…';
  });

  var f=document.getElementById('fail');
  f.querySelector('b').textContent=to;

  // 自动跳转（直接唤起邮件应用）
  setTimeout(function(){ window.location.href=mailto; }, 500);
  // 3 秒后仍留在页面（桌面端无邮件客户端等），显示兜底提示
  setTimeout(function(){
    var st=document.getElementById('st');
    if(st && document.hasFocus()) st.textContent='Email app did not open?';
    f.style.display='block';
    document.getElementById('go').textContent='Try Again — Open Email App';
  }, 3000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>链接转二维码工具</title>
<style>
  :root{
    --navy:#0A1633; --cyan:#22D3EE; --bg:#0f172a; --card:#111c33;
    --line:#1e2d4d; --txt:#e6edf7; --muted:#8aa0c4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(34,211,238,.12),transparent),var(--bg);
    color:var(--txt);min-height:100vh;padding:24px}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.3px}
  h1 .accent{color:var(--cyan)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
  textarea,input[type=text]{width:100%;background:#0a1428;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  select.fieldinput{width:100%;background:#0a1428;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none;appearance:none;cursor:pointer}
  select.fieldinput:focus{border-color:var(--cyan)}
  textarea{resize:vertical;min-height:84px;font-family:inherit}
  textarea:focus,input[type=text]:focus{border-color:var(--cyan)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:120px}
  input[type=range]{width:100%;accent-color:var(--cyan)}
  .val{color:var(--cyan);font-size:12px}
  .colors{display:flex;gap:10px;align-items:center}
  input[type=color]{width:42px;height:32px;border:none;background:none;padding:0;cursor:pointer}
  .ec{display:flex;gap:6px}
  .ec button{flex:1;background:#0a1428;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:8px 0;font-size:13px;cursor:pointer}
  .ec button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px}
  .preview{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
  .qrbox{background:#fff;border-radius:12px;padding:12px;display:inline-flex;margin:8px 0 14px;min-height:120px;align-items:center;justify-content:center}
  .qrbox canvas,.qrbox svg{display:block;max-width:100%}
  .hint{color:#ff7a7a;font-size:13px;min-height:18px;margin-top:6px;text-align:center}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{background:var(--cyan);color:#04222b;border:none;border-radius:10px;padding:10px 16px;
    font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan)}
  .btn:active{transform:translateY(1px)}
  .nav{display:flex;gap:10px;margin-bottom:18px}
  .nav button{background:#0a1428;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
  .nav button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08)}
  .nav .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;
    background:var(--cyan);color:#04222b;font-size:11px;line-height:18px;text-align:center}
  .view{display:none}
  .view.on{display:block}
  .field{margin-top:12px}
  .logo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo-prev{width:54px;height:54px;border-radius:10px;border:1px solid var(--line);background:#0a1428;
    display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--muted)}
  .logo-prev img{width:100%;height:100%;object-fit:contain}
  .filebtn{background:#0a1428;border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 14px;font-size:13px;cursor:pointer}
  .filebtn:hover{border-color:var(--cyan)}
  .filebtn.danger{color:#ff6b6b;border-color:rgba(255,107,107,.4)}
  .filebtn.danger:hover{border-color:#ff6b6b;background:rgba(255,107,107,.08)}
  .mail-prev-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
  .cat-hint{font-size:12px;color:var(--muted);margin:-6px 0 12px;min-height:1px}
  .cat-hint.warn{color:#ffb347}
  .linkbtn{background:none;border:none;color:var(--cyan);font-size:13px;cursor:pointer;text-decoration:underline}
  .cat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .search{background:#0a1428;border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 12px;font-size:13px;outline:none;min-width:220px}
  .search:focus{border-color:var(--cyan)}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .card-item .thumb{background:#fff;border-radius:10px;padding:8px;display:flex;justify-content:center;align-items:center}
  .card-item .thumb canvas{max-width:100%;height:auto}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
  .tag.t-title{color:var(--cyan);border-color:rgba(34,211,238,.4)}
  .tag.t-type{color:#a7f3d0;border-color:rgba(16,185,129,.4)}
  .tag.t-ctype{color:#fcd9a7;border-color:rgba(245,158,11,.4)}
  .card-item .taginput{width:100%;background:#0a1428;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 8px;font-size:12px;outline:none;appearance:none;cursor:pointer}
  .card-item .taginput:focus{border-color:var(--cyan)}
  .card-item .meta{font-size:12px;color:var(--muted);word-break:break-all;max-height:54px;overflow:hidden}
  .card-item .cbtns{display:flex;gap:8px;flex-wrap:wrap}
  .card-item .cbtns button{flex:1;background:#0a1428;border:1px solid var(--line);color:var(--cyan);
    border-radius:8px;padding:7px 0;font-size:12px;cursor:pointer}
  .card-item .cbtns button.del{color:#ff7a7a;border-color:rgba(255,122,122,.4)}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .emailinfo{display:flex;flex-direction:column;gap:5px;margin:12px 0 2px}
  .ei-row{display:flex;gap:8px;font-size:12px;line-height:1.5;align-items:baseline}
  .ei-lbl{color:var(--muted);flex:0 0 92px}
  .ei-val{color:var(--txt);word-break:break-all;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>链接转<span class="accent">二维码</span>工具</h1>
  <div class="sub">纯前端 · 离线可用 · 支持中文与 emoji · 可下载 PNG / SVG · 支持中心 Logo 与目录管理</div>
  <div class="nav">
    <button id="tabGen" class="on">生成器</button>
    <button id="tabMail">邮件二维码</button>
    <button id="tabCat">目录 <span class="badge" id="catCount">0</span></button>
  </div>

  <!-- 生成器 -->
  <div class="view on" id="genView">
    <div class="grid">
      <div class="card">
        <label>链接 / 文本</label>
        <textarea id="text" placeholder="粘贴链接，如 https://example.com">https://example.com</textarea>
        <div class="row">
          <div>
            <label>尺寸 <span class="val" id="sizeVal">320 px</span></label>
            <input type="range" id="size" min="128" max="1024" step="8" value="320" />
          </div>
          <div>
            <label>静区边距 <span class="val" id="marginVal">4</span></label>
            <input type="range" id="margin" min="0" max="10" step="1" value="4" />
          </div>
        </div>
        <label>容错级别</label>
        <div class="ec" id="ec">
          <button data-ec="L">L</button>
          <button data-ec="M" class="on">M</button>
          <button data-ec="Q">Q</button>
          <button data-ec="H">H</button>
        </div>
        <label>颜色</label>
        <div class="colors">
          <span style="font-size:12px;color:var(--muted)">前景</span>
          <input type="color" id="fg" value="#000000" />
          <span style="font-size:12px;color:var(--muted)">背景</span>
          <input type="color" id="bg" value="#ffffff" />
        </div>
        <div class="toggle">
          <input type="checkbox" id="autohttps" checked />
          <label style="margin:0;text-transform:none;letter-spacing:0">无协议链接自动补全 https://</label>
        </div>

        <label>中心 Logo（可选）</label>
        <div class="logo-row">
          <div class="logo-prev" id="logoPrev">无</div>
          <input type="file" id="logoFile" accept="image/*" style="display:none" />
          <button class="filebtn" id="logoPick">选择图片</button>
          <button class="linkbtn" id="logoClear" style="display:none">移除</button>
        </div>
        <div class="hint" id="logoHint" style="text-align:left;color:var(--muted);min-height:0"></div>

        <label>目录标记信息（仅显示在目录页）</label>
        <div class="field">
          <input type="text" id="labTitle" placeholder="标题，如：Dsoon 4K 延时相机" />
        </div>
        <div class="field">
          <input type="text" id="labType" placeholder="产品类型，如：Timelapse Camera" />
        </div>
        <div class="field">
          <select id="labCtype" class="fieldinput">
            <option value="">内容类型（可选）</option>
            <option value="操作视频">操作视频</option>
            <option value="电子说明书">电子说明书</option>
            <option value="社媒">社媒</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <button class="btn" id="genBtn" style="width:100%;margin-top:18px;font-size:15px;padding:13px 0">生成二维码</button>
        <div class="hint" id="genHint" style="text-align:left;color:var(--muted);min-height:0;margin-top:10px"></div>
      </div>
      <div class="card preview">
        <label style="align-self:flex-start">预览</label>
        <div class="qrbox" id="qrbox"></div>
        <div class="hint" id="hint"></div>
        <div class="btns">
          <button class="btn" id="dlPng">下载 PNG</button>
          <button class="btn ghost" id="dlSvg">下载 SVG</button>
          <button class="btn ghost" id="copy">复制图片</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 邮件二维码 -->
  <div class="view" id="mailView">
    <div class="grid">
      <div class="card">
        <label>收件邮箱（必填）</label>
        <input type="text" id="mailTo" placeholder="support@dsoon.com" />
        <label>Product Model（必填）</label>
        <input type="text" id="mailModel" placeholder="如：B0F43KHB78" />
        <label>Product Name（必填）</label>
        <input type="text" id="mailName" placeholder="如：Dsoon 4K Timelapse Camera" />
        <label>邮件标题（可选，留空使用默认）</label>
        <input type="text" id="mailSubject" placeholder="Product Support Request – [Model] – [Name]" />
        <div class="hint" style="text-align:left;color:var(--muted);min-height:0;margin-top:6px">
          默认标题：Product Support Request – [Product Model] – [Product Name]
        </div>
        <label>中心 Logo（可选）</label>
        <div class="logo-row">
          <div class="logo-prev" id="mailLogoPrev">无</div>
          <input type="file" id="mailLogoFile" accept="image/*" style="display:none" />
          <button class="filebtn" id="mailLogoPick">选择图片</button>
          <button class="linkbtn" id="mailLogoClear" style="display:none">移除</button>
        </div>
        <div class="hint" id="mailLogoHint" style="text-align:left;color:var(--muted);min-height:0;margin-top:6px"></div>
        <label style="margin-top:14px">客户将看到的邮件内容（可编辑 · 实时预览）</label>
        <textarea id="mailPreview" style="background:#0a1428;color:var(--txt);min-height:150px"></textarea>
        <div class="mail-prev-bar">
          <span class="hint" style="margin:0">可直接修改邮件内容，生成时以修改后的为准</span>
          <button class="linkbtn" id="mailResetTpl" style="display:none">恢复为模板</button>
        </div>
        <button class="btn" id="mailGenBtn" style="width:100%;margin-top:18px;font-size:15px;padding:13px 0">生成邮件二维码</button>
        <div class="hint" id="mailHint" style="text-align:left;color:var(--muted);min-height:0;margin-top:10px"></div>
      </div>
      <div class="card preview">
        <label style="align-self:flex-start">预览</label>
        <div class="qrbox" id="mailQrbox"></div>
        <div class="hint" style="text-align:left;color:var(--muted);min-height:0;margin-top:10px">点击「生成邮件二维码」生成二维码预览</div>
        <div class="btns">
          <button class="btn" id="mailDlPng">下载 PNG</button>
          <button class="btn ghost" id="mailDlSvg">下载 SVG</button>
          <button class="btn ghost" id="mailCopy">复制图片</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 目录 -->
  <div class="view" id="catView">
    <div class="cat-top">
      <input class="search" id="catSearchInput" placeholder="搜索标题 / 类型 / 内容 / 链接 / 邮箱" />
      <button class="filebtn" id="catExport">导出备份</button>
      <button class="filebtn" id="catImport">导入备份</button>
      <input type="file" id="catImportFile" accept="application/json,.json" style="display:none" />
      <button class="filebtn danger" id="catClear">清空目录</button>
    </div>
    <div class="cat-hint" id="catHint"></div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="empty" id="catEmpty">目录为空。在生成器中生成二维码后会自动加入此处。</div>
  </div>
</div>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {

        var b2 = read();

      var bytes = [];

        if (c < 128) {

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  var autohttps=$('autohttps'), box=$('qrbox'), hint=$('hint');
  var logoHint=$('logoHint'), labTitle=$('labTitle'), labType=$('labType'), labCtype=$('labCtype');
  var ec='M';
  var lastCanvas=null, lastSvg=null;
  var logoDataUrl='', logoImg=null;
  var LOGO_RATIO = 0.22;   // logo 占二维码边长比例（≤25% 保证可识别）
  var THUMB = 200;         // 目录缩略图尺寸

  // ---------- 目录数据 ----------
  var STORE_KEY='qr_catalog_v1';
  var catalog=[];
  function loadCatalog(){ try{ var s=localStorage.getItem(STORE_KEY); if(s){ return JSON.parse(s)||[]; } }catch(e){} return []; }
  function setCatHint(msg, warn){ var el=$('catHint'); if(el){ el.textContent=msg||''; el.classList.toggle('warn', !!warn); } }
  function saveCatalog(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(catalog)); }
    catch(e){
      if(e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014)){
        setCatHint('⚠️ 本地存储空间已满（约 5MB），新条目未能保存。建议导出备份、清空部分带 Logo 的条目，或用「导入备份」迁移到新数据。', true);
      } else {
        setCatHint('⚠️ 本地保存失败：'+(e&&e.message?e.message:e), true);
      }
    }
  }
  catalog=loadCatalog();

  function toUtf8(str){ return unescape(encodeURIComponent(str)); }

  function currentText(){
    var t = textEl.value.trim();
    if(t && autohttps.checked && !/^[a-z][a-z0-9+.-]*:\/\//i.test(t)){
      t = 'https://' + t;
    }
    return t;
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // 生成二维码（canvas + svg），可带中心 logo
  function makeQR(opts){
    var qr = qrcode(0, opts.ecLevel);
    qr.addData(toUtf8(opts.text), 'Byte');
    qr.make();
    var count = qr.getModuleCount();
    var m = opts.margin;
    var size = opts.size;
    var cell = size/(count + 2*m);
    var fg = opts.fg, bg = opts.bg;

    var cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = bg; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = fg;
    for(var r=0;r<count;r++){
      for(var c=0;c<count;c++){
        if(qr.isDark(r,c)){ ctx.fillRect((c+m)*cell,(r+m)*cell,cell,cell); }
      }
    }

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
    svg += '<rect width="100%" height="100%" fill="'+bg+'"/>';
    svg += '<g fill="'+fg+'">';
    for(var r2=0;r2<count;r2++){
      for(var c2=0;c2<count;c2++){
        if(qr.isDark(r2,c2)){ svg += '<rect x="'+((c2+m)*cell)+'" y="'+((r2+m)*cell)+'" width="'+cell+'" height="'+cell+'"/>'; }
      }
    }
    svg += '</g>';

    // logo：SVG 始终用 dataURL 嵌入；canvas 需图片已加载
    if(opts.logoDataUrl){
      var lb = size*0.26, ls = size*LOGO_RATIO;
      svg += '<rect x="'+((size-lb)/2)+'" y="'+((size-lb)/2)+'" width="'+lb+'" height="'+lb+'" rx="'+(lb*0.12)+'" fill="#ffffff"/>';
      svg += '<image x="'+((size-ls)/2)+'" y="'+((size-ls)/2)+'" width="'+ls+'" height="'+ls+'" href="'+opts.logoDataUrl+'" preserveAspectRatio="xMidYMid meet"/>';
    }
    if(opts.logoImg && opts.logoImg.complete && opts.logoImg.naturalWidth){
      drawLogoOn(ctx, size, opts.logoImg);
    }
    svg += '</svg>';

    return {canvas:cv, svg:svg, count:count};
  }

  function drawLogoOn(ctx, size, img){
    var lb = size*0.26, ls = size*LOGO_RATIO, x=(size-lb)/2, y=(size-lb)/2;
    ctx.save();
    ctx.fillStyle='#ffffff';
    roundRect(ctx,x,y,lb,lb,lb*0.12); ctx.fill();
    ctx.drawImage(img,(size-ls)/2,(size-ls)/2,ls,ls);
    ctx.restore();
  }

  function render(){
    var t = currentText();
    hint.textContent='';
    if(!t){ box.innerHTML=''; lastCanvas=null; lastSvg=null; hint.textContent='请输入链接或文本'; return; }
    if(t.length>2000){ box.innerHTML=''; lastCanvas=null; lastSvg=null; hint.textContent='内容过长（>2000 字符），请缩短'; return; }
    try{
      var ecLevel = logoDataUrl ? 'H' : ec;   // 带 logo 时强制 H 级容错
      logoHint.textContent = logoDataUrl ? '已启用 H 级容错（30% 纠错），中心 Logo 仍可正常扫描' : '';
      var res = makeQR({text:t, ecLevel:ecLevel, size:parseInt(sizeEl.value,10),
        margin:parseInt(marginEl.value,10), fg:fgEl.value, bg:bgEl.value,
        logoDataUrl:logoDataUrl, logoImg:logoImg});
      box.innerHTML=''; box.appendChild(res.canvas);
      lastCanvas = res.canvas; lastSvg = res.svg;
      lastSig=sig(t); genSaved=false;   // 标记为未存入目录，等待下载
    }catch(e){
      box.innerHTML=''; lastCanvas=null; lastSvg=null;
      hint.textContent='生成失败：'+(e&&e.message?e.message:e);
    }
  }

  // ---------- 目录：自动存储 ----------
  function sig(t){
    return [t, logoDataUrl?1:0, (logoDataUrl?'H':ec), marginEl.value, fgEl.value, bgEl.value].join('|');
  }
  function entryFields(t){
    return { text:t, ec:(logoDataUrl?'H':ec), size:parseInt(sizeEl.value,10),
      margin:parseInt(marginEl.value,10), fg:fgEl.value, bg:bgEl.value,
      logo:logoDataUrl, title:labTitle.value.trim(), type:labType.value.trim(), ctype:labCtype.value.trim(),
      ts:Date.now() };
  }
  var lastSig=null;
  var genSaved=false;   // 当前二维码是否已存入目录
  function catalogVisible(){ return $('catView').classList.contains('on'); }
  // 仅在点击「下载」时把生成器二维码存入目录
  function saveCurrentGen(){
    var t=currentText(); if(!t) return;
    var s=sig(t);
    if(genSaved && s===lastSig){
      // 同一二维码已保存：同步最新标记字段
      var head=catalog[0];
      if(head && head.text===t){ head.title=labTitle.value.trim(); head.type=labType.value.trim(); head.ctype=labCtype.value.trim();
        head.logo=logoDataUrl; saveCatalog();
        if(catalogVisible()) renderCatalog(); }
      return;
    }
    var e=entryFields(t); e.id='q'+Date.now()+Math.floor(Math.random()*1000);
    catalog.unshift(e); genSaved=true; lastSig=s; saveCatalog(); updateCount();
    if(catalogVisible()) renderCatalog();
  }
  // ---------- 目录渲染 ----------
  var logoCache={};
  function getLogo(url, cb){
    if(!url){ cb(null); return; }
    if(logoCache[url] && logoCache[url].complete && logoCache[url].naturalWidth){ cb(logoCache[url]); return; }
    var im=new Image(); im.onload=function(){ cb(im); }; im.onerror=function(){ cb(null); }; im.src=url; logoCache[url]=im;
  }
  function updateCount(){ $('catCount').textContent=catalog.length; }

  function renderCatalog(){
    var grid=$('catGrid'); grid.innerHTML='';
    var q=($('catSearchInput').value||'').trim().toLowerCase();
    var list=catalog.filter(function(e){
      if(!q) return true;
      var hay=[e.title,e.type,e.ctype,e.text];
      if(e.kind==='email'){ hay.push(e.mailTo, e.mailModel, e.mailName); }
      return hay.join(' ').toLowerCase().indexOf(q)>=0;
    });
    $('catEmpty').style.display = list.length? 'none':'block';
    list.forEach(function(e){
      var card=document.createElement('div'); card.className='card-item';

      var thumb=document.createElement('div'); thumb.className='thumb';
      var cv=document.createElement('canvas'); thumb.appendChild(cv);
      card.appendChild(thumb);

      if(e.kind==='email'){
        var info=document.createElement('div'); info.className='emailinfo';
        info.appendChild(eiRow('收件邮箱', e.mailTo));
        info.appendChild(eiRow('Product Model', e.mailModel));
        info.appendChild(eiRow('Product Name', e.mailName));
        card.appendChild(info);
      } else {
        var tags=document.createElement('div'); tags.className='tags';
        if(e.title) tags.appendChild(tag('t-title', e.title));
        if(e.type) tags.appendChild(tag('t-type', e.type));
        if(e.ctype) tags.appendChild(tag('t-ctype', e.ctype));
        if(!e.title && !e.type && !e.ctype) tags.appendChild(tag('', '（未标记）'));
        card.appendChild(tags);

        var ti=document.createElement('input'); ti.className='taginput'; ti.placeholder='标题'; ti.value=e.title||'';
        var ty=document.createElement('input'); ty.className='taginput'; ty.placeholder='产品类型'; ty.value=e.type||'';
        var ct=document.createElement('select'); ct.className='taginput';
        [['','内容类型（可选）'],['操作视频','操作视频'],['电子说明书','电子说明书'],['社媒','社媒'],['其他','其他']].forEach(function(o){
          var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; ct.appendChild(op);
        });
        ct.value=e.ctype||'';
        function commit(){ e.title=ti.value.trim(); e.type=ty.value.trim(); e.ctype=ct.value.trim(); saveCatalog(); renderCatalog(); }
        ti.addEventListener('change',commit); ty.addEventListener('change',commit); ct.addEventListener('change',commit);
        card.appendChild(ti); card.appendChild(ty); card.appendChild(ct);
      }

      var meta=document.createElement('div'); meta.className='meta'; meta.textContent=e.text;
      card.appendChild(meta);

      var btns=document.createElement('div'); btns.className='cbtns';
      var dp=document.createElement('button'); dp.textContent='PNG'; dp.onclick=function(){ downloadPng(e); };
      var ds=document.createElement('button'); ds.textContent='SVG'; ds.onclick=function(){ downloadSvg(e); };
      var cpi=document.createElement('button'); cpi.textContent='复制图片';
      cpi.onclick=(function(btn){
        return function(){
          var canvas=thumb.querySelector('canvas');
          if(!canvas){ alert('二维码尚未加载完成，请稍候'); return; }
          if(!navigator.clipboard || !window.ClipboardItem){ alert('当前浏览器不支持复制图片'); return; }
          canvas.toBlob(function(blob){
            navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
              btn.textContent='已复制'; setTimeout(function(){ btn.textContent='复制图片'; }, 1200);
            }).catch(function(){ btn.textContent='失败'; setTimeout(function(){ btn.textContent='复制图片'; }, 1200); });
          });
        };
      })(cpi);
      var cp=document.createElement('button'); cp.textContent='复制链接';
      cp.onclick=(function(btn){
        return function(){
          if(!navigator.clipboard || !navigator.clipboard.writeText){ alert('当前浏览器不支持复制，请手动复制链接'); return; }
          navigator.clipboard.writeText(e.text).then(function(){
            btn.textContent='已复制'; setTimeout(function(){ btn.textContent='复制链接'; }, 1200);
          }).catch(function(){ btn.textContent='失败'; setTimeout(function(){ btn.textContent='复制链接'; }, 1200); });
        };
      })(cp);
      var dl=document.createElement('button'); dl.className='del'; dl.textContent='删除';
      dl.onclick=function(){ catalog=catalog.filter(function(x){ return x.id!==e.id; }); saveCatalog(); renderCatalog(); updateCount(); };
      btns.appendChild(dp); btns.appendChild(ds); btns.appendChild(cpi); btns.appendChild(cp); btns.appendChild(dl);
      card.appendChild(btns);

      grid.appendChild(card);

      getLogo(e.logo, function(im){
        var res=makeQR({text:e.text, ecLevel:e.ec, size:THUMB, margin:e.margin,
          fg:e.fg, bg:e.bg, logoDataUrl:e.logo, logoImg:im});
        thumb.innerHTML=''; thumb.appendChild(res.canvas);
      });
    });
  }
  function tag(cls, txt){ var s=document.createElement('span'); s.className='tag '+(cls||''); s.textContent=txt; return s; }
  function eiRow(label, val){ var row=document.createElement('div'); row.className='ei-row'; var l=document.createElement('span'); l.className='ei-lbl'; l.textContent=label; var v=document.createElement('span'); v.className='ei-val'; v.textContent=val||'—'; row.appendChild(l); row.appendChild(v); return row; }

  function downloadPng(e){
    getLogo(e.logo, function(im){
      var res=makeQR({text:e.text, ecLevel:e.ec, size:e.size, margin:e.margin,
        fg:e.fg, bg:e.bg, logoDataUrl:e.logo, logoImg:im});
      var a=document.createElement('a'); a.download='qrcode-'+(e.id||'x')+'.png'; a.href=res.canvas.toDataURL('image/png'); a.click();
    });

  function downloadSvg(e){

    var res=makeQR({text:e.text, ecLevel:e.ec, size:e.size, margin:e.margin,

  // ---------- 事件 ----------

    if(ev.target && ev.target.dataset.ec){
      ec = ev.target.dataset.ec;
      Array.prototype.forEach.call(this.children, function(b){ b.classList.remove('on'); });
      ev.target.classList.add('on');

    }
  });

  // 生成按钮：唯一触发二维码生成的入口
  $('genBtn').addEventListener('click', function(){
    $('genHint').textContent='';
    render();
  });

  // logo 上传
  $('logoPick').addEventListener('click', function(){ $('logoFile').click(); });
  $('logoClear').addEventListener('click', function(){
    logoDataUrl=''; logoImg=null; $('logoFile').value='';
    $('logoPrev').innerHTML='无'; $('logoClear').style.display='none';
    logoHint.textContent='';
  });
  $('logoFile').addEventListener('change', function(){
    var f=this.files && this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      logoDataUrl=rd.result;
      logoImg=new Image();
      logoImg.onload=function(){
        $('logoPrev').innerHTML=''; var im=document.createElement('img'); im.src=logoDataUrl; $('logoPrev').appendChild(im);
        $('logoClear').style.display='inline-block';
        logoHint.textContent='Logo 已就绪，点击「生成二维码」应用';
      };
      logoImg.src=logoDataUrl;
    };
    rd.readAsDataURL(f);
  });

  // 下载 / 复制 / 保存
  $('dlPng').addEventListener('click', function(){
    if(!lastCanvas) return;
    saveCurrentGen();
    var a=document.createElement('a'); a.download='qrcode.png'; a.href=lastCanvas.toDataURL('image/png'); a.click();
  });
  $('dlSvg').addEventListener('click', function(){
    if(!lastSvg) return;
    saveCurrentGen();
    var blob=new Blob([lastSvg],{type:'image/svg+xml'}); var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.download='qrcode.svg'; a.href=url; a.click(); URL.revokeObjectURL(url);
  });
  $('copy').addEventListener('click', function(){
    if(!lastCanvas) return;
    saveCurrentGen();
    if(!navigator.clipboard || !window.ClipboardItem){ hint.textContent='当前浏览器不支持复制图片'; return; }
    lastCanvas.toBlob(function(blob){
      navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
        hint.textContent='已复制到剪贴板';
      }).catch(function(){ hint.textContent='复制失败，请手动下载'; });
    });
  });
  // 目录 tab
  $('tabGen').addEventListener('click', function(){ switchTab('gen'); });
  $('tabMail').addEventListener('click', function(){ switchTab('mail'); });
  $('tabCat').addEventListener('click', function(){ switchTab('cat'); renderCatalog(); });
  function switchTab(which){
    var map={gen:'tabGen', mail:'tabMail', cat:'tabCat'};
    var vmap={gen:'genView', mail:'mailView', cat:'catView'};
    Object.keys(map).forEach(function(k){
      $(map[k]).classList.toggle('on', k===which);
      $(vmap[k]).classList.toggle('on', k===which);
    });
  }
  $('catSearchInput').addEventListener('input', renderCatalog);
  $('catClear').addEventListener('click', function(){
    if(!catalog.length) return;
    if(confirm('确定清空目录中所有二维码？此操作不可撤销。')){
      catalog=[]; lastSig=null; saveCatalog(); renderCatalog(); updateCount();
      setCatHint('已清空目录。');
    }
  });

  // ---------- 导出 / 导入备份 ----------
  function downloadBlob(blob, filename){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function stamp(){
    var d=new Date(), p=function(n){ return (n<10?'0':'')+n; };
    return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
  }
  $('catExport').addEventListener('click', function(){
    if(!catalog.length){ setCatHint('目录为空，无可导出的数据。', true); return; }
    var payload={ app:'qr-tool', version:1, exportedAt:Date.now(), catalog:catalog };
    var blob=new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    downloadBlob(blob, 'qr-catalog-backup-'+stamp()+'.json');
    setCatHint('已导出 '+catalog.length+' 条二维码备份（JSON 文件）。');
  });
  $('catImport').addEventListener('click', function(){ $('catImportFile').click(); });
  $('catImportFile').addEventListener('change', function(){
    var f=this.files && this.files[0]; if(!f) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);
        var list=Array.isArray(data)?data:(data&&data.catalog?data.catalog:null);
        if(!Array.isArray(list)) throw new Error('文件格式不正确');
        var byId={}; catalog.forEach(function(e){ if(e&&e.id) byId[e.id]=true; });
        var added=0;
        list.forEach(function(e){
          if(e && e.id && !byId[e.id]){ catalog.push(e); byId[e.id]=true; added++; }
          else if(e && !e.id){ e.id='q'+Date.now()+Math.floor(Math.random()*1000); catalog.push(e); added++; }
        });
        saveCatalog(); renderCatalog(); updateCount();
        setCatHint('已导入 '+added+' 条新二维码（按 ID 去重合并）。');
      }catch(err){ setCatHint('导入失败：'+(err&&err.message?err.message:err), true); }
      finally{ $('catImportFile').value=''; }
    };
    reader.readAsText(f);
  });

  // ---------- 邮件二维码 ----------
  var mailHintEl=$('mailHint');
  var emailCanvas=null, emailSvg=null, emailMailto='';
  var emailLogoDataUrl='', emailLogoImg=null;
  var mailManual=false;   // 邮件内容是否被用户手动编辑
  var mailSaved=false, lastMailEntry=null, lastMailSig='';   // 邮件二维码是否已于下载时存入目录
  function buildMailBody(model, name){
    return 'Hello,\n' +
      "I'm contacting you regarding the following product:\n" +
      'Product Model: ' + model + '\n' +
      'Product Name: ' + name + '\n' +
      'Amazon Order Number: [Please enter your order number]\n' +
      'Problem Description: [Please describe the issue you are experiencing here. ]';
  }
  function buildMailSubject(model, name, custom){
    if(custom && custom.trim()) return custom.trim();
    return 'Product Support Request – ' + model + ' – ' + name;
  }
  function buildMailto(to, subject, body){
    return 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }
  function updateMailPreview(){
    if(mailManual) return;   // 用户已手动修改，不再用模板覆盖
    var model=$('mailModel').value.trim();
    var name=$('mailName').value.trim();
    var custom=$('mailSubject').value.trim();
    var subject=buildMailSubject(model, name, custom);
    var body=buildMailBody(model, name);
    $('mailPreview').value='Subject: ' + subject + '\n\n' + body;
  }
  function parseMailPreview(){
    // 解析预览文本域，提取 subject / body（兼容手动编辑）
    var model=$('mailModel').value.trim();
    var name=$('mailName').value.trim();
    var custom=$('mailSubject').value.trim();
    var subject=buildMailSubject(model, name, custom); // 默认主题（解析失败时兜底）
    var body=buildMailBody(model, name);
    var s=($('mailPreview').value||'');
    var idx=s.indexOf('\n\n');
    if(s.indexOf('Subject:')===0 && idx>0){
      subject=s.slice(8, idx).replace(/\s+$/,'');
      body=s.slice(idx+2);
    } else if(idx>0){
      subject=s.slice(0, idx).replace(/\s+$/,'');
      body=s.slice(idx+2);
    } else if(s){
      body=s;
    }
    return { subject:subject, body:body };
  }
  function setMailManual(on){
    mailManual = on;
    $('mailResetTpl').style.display = on ? 'inline-block' : 'none';
  }
  function renderEmail(){
    var to=$('mailTo').value.trim();
    var model=$('mailModel').value.trim();
    var name=$('mailName').value.trim();
    var custom=$('mailSubject').value.trim();
    mailHintEl.textContent='';
    if(!to){ emailCanvas=null; emailSvg=null; emailMailto=''; $('mailQrbox').innerHTML=''; mailHintEl.textContent='请填写收件邮箱'; return; }
    if(!model){ emailCanvas=null; emailSvg=null; emailMailto=''; $('mailQrbox').innerHTML=''; mailHintEl.textContent='请填写 Product Model'; return; }
    if(!name){ emailCanvas=null; emailSvg=null; emailMailto=''; $('mailQrbox').innerHTML=''; mailHintEl.textContent='请填写 Product Name'; return; }
    var parsed=parseMailPreview();
    var subject=parsed.subject, body=parsed.body;
    var mailto=buildMailto(to, subject, body);
    var ecLevel = emailLogoDataUrl ? 'H' : 'M';
    try{
      var res=makeQR({text:mailto, ecLevel:ecLevel, size:320, margin:4, fg:'#000000', bg:'#ffffff', logoDataUrl:emailLogoDataUrl, logoImg:emailLogoImg});
      $('mailQrbox').innerHTML=''; $('mailQrbox').appendChild(res.canvas);
      emailCanvas=res.canvas; emailSvg=res.svg; emailMailto=mailto;
      lastMailEntry={ text:mailto, ec:ecLevel||'M', size:320, margin:4, fg:'#000000', bg:'#ffffff', logo:emailLogoDataUrl||'',
        kind:'email', mailTo:to, mailModel:model, mailName:name, ts:Date.now() };
      mailSaved=false; lastMailSig=mailto;   // 标记为未存入目录，等待下载
    }catch(e){
      emailCanvas=null; emailSvg=null; emailMailto='';
      mailHintEl.textContent='生成失败：'+(e&&e.message?e.message:e);
    }
  }
  // 仅在点击「下载」时把邮件二维码存入目录
  function saveCurrentEmail(){
    if(!lastMailEntry) return;
    if(mailSaved && lastMailEntry.text===lastMailSig) return;
    lastMailEntry.id='q'+Date.now()+Math.floor(Math.random()*1000);
    catalog.unshift(lastMailEntry); mailSaved=true; saveCatalog(); updateCount();
    if(catalogVisible()) renderCatalog();
  }
  $('mailGenBtn').addEventListener('click', renderEmail);
  ['mailTo','mailModel','mailName','mailSubject'].forEach(function(id){
    $(id).addEventListener('input', function(){ updateMailPreview(); });
  });
  $('mailPreview').addEventListener('input', function(){ setMailManual(true); });
  $('mailResetTpl').addEventListener('click', function(){ setMailManual(false); updateMailPreview(); });
  updateMailPreview();   // 进入邮件页即显示默认/当前内容的实时预览
  $('mailDlPng').addEventListener('click', function(){
    if(!emailCanvas) return;
    saveCurrentEmail();
    var a=document.createElement('a'); a.download='email-qr-'+($('mailModel').value.trim()||'x')+'.png'; a.href=emailCanvas.toDataURL('image/png'); a.click();
  });
  $('mailDlSvg').addEventListener('click', function(){
    if(!emailSvg) return;
    saveCurrentEmail();
    var blob=new Blob([emailSvg],{type:'image/svg+xml'}); var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.download='email-qr-'+($('mailModel').value.trim()||'x')+'.svg'; a.href=url; a.click(); URL.revokeObjectURL(url);
  });
  $('mailCopy').addEventListener('click', function(){
    if(!emailCanvas){ mailHintEl.textContent='请先生成邮件二维码'; return; }
    saveCurrentEmail();
    if(!navigator.clipboard || !window.ClipboardItem){ mailHintEl.textContent='当前浏览器不支持复制图片'; return; }
    emailCanvas.toBlob(function(blob){
      navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){
        mailHintEl.textContent='已复制到剪贴板';
      }).catch(function(){ mailHintEl.textContent='复制失败，请手动下载'; });
    });
  });

  // 邮件二维码 Logo（可选）
  $('mailLogoPick').addEventListener('click', function(){ $('mailLogoFile').click(); });
  $('mailLogoClear').addEventListener('click', function(){
    emailLogoDataUrl=''; emailLogoImg=null; $('mailLogoFile').value='';
    $('mailLogoPrev').innerHTML='无'; $('mailLogoClear').style.display='none';
    $('mailLogoHint').textContent='';
  });
  $('mailLogoFile').addEventListener('change', function(){
    var f=this.files && this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      emailLogoDataUrl=rd.result;
      emailLogoImg=new Image();
      emailLogoImg.onload=function(){
        $('mailLogoPrev').innerHTML=''; var im=document.createElement('img'); im.src=emailLogoDataUrl; $('mailLogoPrev').appendChild(im);
        $('mailLogoClear').style.display='inline-block';
        $('mailLogoHint').textContent='Logo 已就绪，点击「生成邮件二维码」应用（带 Logo 自动启用 H 级容错）';
      };
      emailLogoImg.src=emailLogoDataUrl;
    };
    rd.readAsDataURL(f);
  });

  updateCount();
  // 初始不自动生成，等待用户点击「生成二维码」
  box.innerHTML='<div style="color:var(--muted);text-align:center;padding:28px 12px;font-size:13px">点击「生成二维码」按钮生成预览</div>';
  $('genHint').textContent='修改链接 / 样式 / Logo 后，需点击「生成二维码」生效；下载后自动存入目录';
  // 禁用右键保存二维码（所有页面：生成器预览、邮件预览、目录缩略图、Logo 预览）
  document.addEventListener('contextmenu', function(e){
    var t=e.target;
    if(t && (t.tagName==='CANVAS' || t.tagName==='IMG')){ e.preventDefault(); }
  });
})();
</script>
</body>
</html>
